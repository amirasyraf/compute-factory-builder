---
# Connection settings for Windows builds: Packer's WinRM communicator over HTTPS with a
# self-signed certificate. Packer supplies the host, port and user, and the password as
# CF_WINRM_PASSWORD (kept off the logged command line). The build user is an administrator.
ansible_connection: winrm
ansible_winrm_transport: ntlm
ansible_winrm_server_cert_validation: ignore
ansible_winrm_operation_timeout_sec: 120
ansible_winrm_read_timeout_sec: 150
ansible_password: "{{ lookup('env', 'CF_WINRM_PASSWORD') }}"
