---
# Windows updates are not applied here: the AWS and Azure base images are patched monthly, and a
# VM's OS Updates action installs the rest. Base packages: none beyond the OS.
- name: Set UTC timezone
  ansible.windows.win_timezone:
    timezone: UTC
- name: Create image metadata directory
  ansible.windows.win_file:
    path: C:\ProgramData\ComputeFactory
    state: directory
- name: Record image provenance
  ansible.windows.win_copy:
    dest: C:\ProgramData\ComputeFactory\image-info.json
    content: "{{ {'image_name': cf_image_name, 'build_date': cf_build_date, 'git_sha': cf_git_sha} | to_nice_json }}\n"
- name: Allow Remote Desktop logins (browser RDP reaches them through an SSH tunnel)
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
    name: fDenyTSConnections
    data: 0
    type: dword
# As SYSTEM, Microsoft.WinGet.Client only works in PowerShell 7 (Windows PowerShell 5.1 refuses
# with WindowsPowerShellNotSupported); the fry software stage runs it with pwsh.exe.
- name: Download PowerShell 7 (LTS)
  ansible.windows.win_get_url:
    url: https://github.com/PowerShell/PowerShell/releases/download/v7.6.10/PowerShell-7.6.10-win-x64.msi
    dest: C:\Windows\Temp\PowerShell-7.6.10-win-x64.msi
    checksum: 7d8daea48b450d4d62fcd1ac4d6faa7ac2db5e11aba5061ee81b7496adca8c07
    checksum_algorithm: sha256
- name: Install PowerShell 7
  ansible.windows.win_package:
    path: C:\Windows\Temp\PowerShell-7.6.10-win-x64.msi
    arguments: /quiet /norestart ADD_PATH=1 USE_MU=0 ENABLE_MU=0
    creates_path: C:\Program Files\PowerShell\7\pwsh.exe
- name: Remove the PowerShell 7 installer
  ansible.windows.win_file:
    path: C:\Windows\Temp\PowerShell-7.6.10-win-x64.msi
    state: absent
# The fry software stage installs catalog packages as SYSTEM with this module (the winget CLI is
# not supported as SYSTEM); it needs App Installer (WinGet) installed. The Azure base image has none,
# and sysprep refuses app packages installed for a user but not provisioned for all users, so the
# pinned WinGet release is provisioned for all users and installed for the build user.
- name: Install the WinGet PowerShell module for all users
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope AllUsers | Out-Null
      Install-Module -Name Microsoft.WinGet.Client -Repository PSGallery -Scope AllUsers -Force
- name: Provision WinGet (App Installer) for all users
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $ProgressPreference = 'SilentlyContinue'
      $base = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.380'
      $files = @{
        'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' = '65dea9c01ce08ee7b763366b27c0e651f97db857c11ca9b9c301826c10092f2e'
        'DesktopAppInstaller_Dependencies.zip' = 'ba875afe9d190f61218985ac0292a99d1db710bf93e13c68944ca9d89f0d82d1'
        'e53e159d00e04f729cc2180cffd1c02e_License1.xml' = 'bcb15118ec47df24e3e6013a7006147c3a15b3a8104ed660fe87c8b4ed01f485'
      }
      $dir = Join-Path $env:TEMP 'cf-winget'
      New-Item -ItemType Directory -Force -Path $dir | Out-Null
      foreach ($name in $files.Keys) {
        $path = Join-Path $dir $name
        Invoke-WebRequest -UseBasicParsing -Uri "$base/$name" -OutFile $path
        if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $files[$name]) { throw "checksum mismatch: $name" }
      }
      Expand-Archive -Force -Path (Join-Path $dir 'DesktopAppInstaller_Dependencies.zip') -DestinationPath (Join-Path $dir 'deps')
      $deps = @(Get-ChildItem -Recurse -Path (Join-Path $dir 'deps') -Include *.appx, *.msix | Where-Object { $_.FullName -match '\\x64\\' }).FullName
      if (-not $deps) { throw 'no x64 dependency packages in DesktopAppInstaller_Dependencies.zip' }
      $bundle = Join-Path $dir 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'
      Add-AppxProvisionedPackage -Online -PackagePath $bundle -DependencyPackagePath $deps `
        -LicensePath (Join-Path $dir 'e53e159d00e04f729cc2180cffd1c02e_License1.xml') | Out-Null
      Add-AppxPackage -Path $bundle -DependencyPath $deps -ForceApplicationShutdown
      Remove-Item -Recurse -Force $dir
      $installed = Get-AppxPackage -Name Microsoft.DesktopAppInstaller
      if ([version]$installed.Version -lt [version]'1.29.380.0') { throw "App Installer is $($installed.Version)" }
# As SYSTEM in PowerShell 7, the way the fry software stage uses it.
- name: Check that WinGet can search the catalog source
  become: true
  become_method: runas
  become_user: SYSTEM
  ansible.windows.win_powershell:
    executable: C:\Program Files\PowerShell\7\pwsh.exe
    script: |
      $ErrorActionPreference = 'Stop'
      Import-Module Microsoft.WinGet.Client
      $Ansible.Changed = $false
      if (-not (Find-WinGetPackage -Id Git.Git -MatchOption Equals -Source winget)) { throw 'WinGet cannot find Git.Git' }
